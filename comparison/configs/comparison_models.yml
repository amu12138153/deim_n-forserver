# Paths are relative to the repository root; override with --data-root/--output-root.
data_root: fish_dataset622
output_root: comparison_outputs/fish_n_query_200e_common_aug
image_size: 640

# Matched training budget and one-image augmentation; source base LRs are retained.
training_protocol:
  epochs: 200
  batch_size: 8
  warmup_epochs: 4
  cosine_min_lr_ratio: 0.0
  augmentation: resize640_horizontal_flip_p05
  seed: 0
test_source_split: test
annotations:
  train: coco_detection_train0.json
  val: coco_detection_val0.json
  test: coco_detection_test0.json
models:
  yolov8n:
    type: ultralytics
    display_name: YOLOv8n
    model: yolov8n.pt
    pretrained: true
    epochs: 200
    batch_size: 8
  yolo11n:
    type: ultralytics
    display_name: YOLO11n
    model: yolo11n.pt
    pretrained: true
    epochs: 200
    batch_size: 8
  yolo26n:
    type: ultralytics
    display_name: YOLO26n
    model: yolo26n.pt
    pretrained: true
    epochs: 200
    batch_size: 8
  deimv2_n:
    type: deim
    display_name: DEIMv2-HGNetv2-N
    config: configs/deimv2/ablation_n/M0_visual.yml
    pretrained: true
    pretrained_scope: HGNetv2-B0 backbone
    epochs: 200
    batch_size: 8
  ours:
    type: deim
    display_name: Ours
    config: configs/deimv2/ablation_n/M4_full.yml
    pretrained: true
    pretrained_scope: HGNetv2-B0 backbone
    epochs: 200
    batch_size: 8
  dfine_n:
    type: external
    display_name: D-FINE-N
    family: dfine
    repo: D-FINE
    repo_subdir: .
    config: configs/dfine/dfine_hgnetv2_n_coco.yml
    train_entry: train.py
    checkpoint_name: best_stg1.pth
    pretrained: true
    pretrained_scope: HGNetv2 backbone
    epochs: 200
    batch_size: 8
    use_amp: true
  dfine_s:
    type: external
    display_name: D-FINE-S
    family: dfine
    repo: D-FINE
    repo_subdir: .
    config: configs/dfine/dfine_hgnetv2_s_coco.yml
    train_entry: train.py
    checkpoint_name: best_stg1.pth
    pretrained: true
    pretrained_scope: HGNetv2 backbone
    epochs: 200
    batch_size: 8
    use_amp: true
  rtdetrv2_s:
    type: external
    display_name: RT-DETRv2-S
    family: rtdetrv2
    repo: RT-DETR
    repo_subdir: rtdetrv2_pytorch
    config: configs/rtdetrv2/rtdetrv2_r18vd_120e_coco.yml
    train_entry: tools/train.py
    checkpoint_name: best.pth
    pretrained: true
    pretrained_scope: ResNet-18 backbone
    epochs: 200
    batch_size: 8
    use_amp: true
  rtdetr_r18:
    type: external
    display_name: RT-DETR-R18
    family: rtdetr
    repo: RT-DETR
    repo_subdir: rtdetrv2_pytorch
    config: configs/rtdetr/rtdetr_r18vd_6x_coco.yml
    train_entry: tools/train.py
    checkpoint_name: best.pth
    pretrained: true
    pretrained_scope: ResNet-18 backbone
    epochs: 200
    batch_size: 8
    use_amp: true
