__include__: ['../visdrone_pico.yml']

# Water-quality fusion only in LiteEncoder (FPN and PAN features).
# Keep the dataset and AMP setting consistent with the existing M4 run.
experiment_name: water_encoder_only
output_dir: ./outputs/water_fusion_locations/encoder
use_amp: True

train_dataloader:
  dataset:
    img_folder: ./fish_dataset622/train
    ann_file: ./fish_dataset622/train/coco_detection_train0.json
    sensor_csv: ./fish_dataset622/train/train.csv
    use_water_quality: True
val_dataloader:
  dataset:
    img_folder: ./fish_dataset622/val
    ann_file: ./fish_dataset622/val/coco_detection_val0.json
    sensor_csv: ./fish_dataset622/val/val.csv
    use_water_quality: True

HGNetv2:
  use_water_quality: False
LiteEncoder:
  use_water_quality: True
DEIMTransformer:
  use_water_quality: False
  water_features: []
  water_self_attn: False
  query_water_cross_attn: False
  learnable_gate: False
